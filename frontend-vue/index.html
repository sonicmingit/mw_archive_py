<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>本地模型库 · Vue 3</title>
    <meta name="description" content="MakerWorld Archive standalone Vue 3 frontend" />
    <link rel="icon" type="image/png" href="/fav.png" />
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('mw_vue_theme') || 'light';
          document.documentElement.dataset.theme = theme;
        } catch (_) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
  </html>
